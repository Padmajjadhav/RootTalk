
services:
  - type: web
    name: roottalk
    env: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt && python database/seed.py
    startCommand: python run_server.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: ENVIRONMENT
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: roottalk-postgres
          property: connectionString

      - key: UPLOAD_DIR
        value: uploads

      - key: ALLOWED_ORIGINS
        value: https://roottalk.onrender.com

databases:
  - name: roottalk-postgres
    databaseName: roottalk
    user: roottalk_user
    plan: free
